interface:
  display_name: "Pleo Library Prompt Model Triage"
  short_description: "Routing modelu i thinking dla Gemini"
  default_prompt: "Użyj $pleo-library-prompt-model-triage, aby dobrać najtańszy sensowny model Gemini, thinking level i kolejny skill; nie rozpoczynaj wykonania, gdy brakuje decyzji zmieniającej scope, środowisko lub rezultat."

provider:
  name: "gemini"
  catalog_verified_on: "2026-08-24"
  reference: "references/gemini.md"
  default_tier: "balanced"
  default_model: "gemini-3.7-flash"
  default_reasoning: "medium"
  reasoning_levels:
    gemini-3.7-flash: ["low", "medium", "high"]
    gemini-3.5-flash-lite: ["minimal", "low", "medium", "high"]
    gemini-3.1-pro-preview: ["low", "medium", "high"]
  model_status:
    gemini-3.7-flash: "ga"
    gemini-3.5-flash-lite: "ga"
    gemini-3.1-pro-preview: "preview"
  aliases: {}
  notes:
    - "Gemini 3.1 Pro jest preview; dla produkcji domyślnie preferuj GA 3.7 Flash."
    - "Gemini 3.x używa thinkingLevel; nie mieszaj z thinkingBudget z 2.5."
    - "Thinking tokens są zawarte w cenie output."
  tier_map:
    cheap: ["gemini-3.5-flash-lite"]
    balanced: ["gemini-3.7-flash"]
    deep: ["gemini-3.7-flash", "gemini-3.1-pro-preview"]
    max: ["gemini-3.1-pro-preview"]
  pricing_metadata:
    currency: "USD"
    unit: "per_1m_tokens"
    reasoning_billing: "included_in_output"
  pricing_estimates:
    gemini-3.7-flash:
      input_per_1m: 0.75
      output_per_1m: 3.75
      reasoning_per_1m: 3.75
      promotional_through: "2026-12-31"
      standard_input_after_promotion: 1.50
      standard_output_after_promotion: 7.50
    gemini-3.5-flash-lite:
      input_per_1m: 0.30
      output_per_1m: 2.50
      reasoning_per_1m: 2.50
    gemini-3.1-pro-preview:
      input_per_1m_up_to_200k: 2.00
      output_per_1m_up_to_200k: 12.00
      reasoning_per_1m_up_to_200k: 12.00
      input_per_1m_over_200k: 4.00
      output_per_1m_over_200k: 18.00
      reasoning_per_1m_over_200k: 18.00
